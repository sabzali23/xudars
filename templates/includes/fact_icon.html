{% comment %}
Рисунки для карточек «Интересно детям». Нарисованы линиями прямо в HTML: на слабом интернете
это не стоит ни одного лишнего запроса. Имя приходит из поля «icon» в learning/facts.py.
{% endcomment %}
<svg class="fact-icon" width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if icon == "pyramid" %}
  <path d="M24 7 44 39H4z"/><path d="M24 7v32"/><path d="M14 23h20"/>
{% elif icon == "mountain" %}
  <path d="M3 38 18 14l9 14 5-7 13 17z"/><path d="M13 22h10"/><circle cx="37" cy="11" r="4"/>
{% elif icon == "moon" %}
  <circle cx="24" cy="24" r="16"/><circle cx="18" cy="18" r="3.5"/><circle cx="31" cy="27" r="4.5"/><circle cx="18" cy="32" r="2"/>
{% elif icon == "whale" %}
  <ellipse cx="20" cy="27" rx="14" ry="9"/><path d="M34 27l10-7v14z"/><path d="M17 18v-3"/><path d="M17 15c0-2 2-3 3-1"/><circle cx="13" cy="24" r="1.4" fill="currentColor" stroke="none"/>
{% elif icon == "water" %}
  <path d="M24 5s12 13 12 21a12 12 0 0 1-24 0C12 18 24 5 24 5z"/><path d="M18 27c0 4 3 7 7 7"/>
{% elif icon == "rainbow" %}
  <path d="M5 38a19 19 0 0 1 38 0"/><path d="M12 38a12 12 0 0 1 24 0"/><path d="M19 38a5 5 0 0 1 10 0"/><path d="M3 42h42"/>
{% else %}
  <circle cx="24" cy="24" r="16"/><path d="M24 31v-1c0-3 4-4 4-8a4 4 0 0 0-8 0"/><circle cx="24" cy="36" r="1.4" fill="currentColor" stroke="none"/>
{% endif %}
</svg>

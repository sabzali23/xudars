# Описание развёртывания для Render: веб-сервис и база PostgreSQL.
# Render читает этот файл сам — сервис и базу вручную создавать не нужно.
databases:
  - name: xudars-db
    databaseName: xudars
    user: xudars
    plan: free
    region: frankfurt

services:
  - type: web
    name: xudars
    runtime: python
    plan: free
    region: frankfurt
    # Миграции и загрузка учебного контента идут при каждой сборке: контент лежит в файлах,
    # а не в базе, поэтому после развёртывания темы должны попасть в новую базу.
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py load_content"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xudars-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.10"
